<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="740" height="300" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <rect width="740" height="300" fill="#FFFFFF"/>
  <text x="20" y="26" font-size="14" font-weight="600" fill="#1B2434">B1_LITHO_02 — CD X-bar 管制圖</text>
  <text x="20" y="44" font-size="11" fill="#8B99AE">Target 45.0 nm　Spec 43.5 ~ 46.5 nm　單位：nm</text>

  <!-- y scale: 43.0 -> 250, 47.0 -> 70  => y = 250 - (v-43)*45 -->
  <g stroke="#EDF0F4" stroke-width="1">
    <line x1="60" y1="250" x2="700" y2="250"/>
    <line x1="60" y1="205" x2="700" y2="205"/>
    <line x1="60" y1="160" x2="700" y2="160"/>
    <line x1="60" y1="115" x2="700" y2="115"/>
    <line x1="60" y1="70" x2="700" y2="70"/>
  </g>
  <g font-size="10" fill="#8B99AE" text-anchor="end">
    <text x="52" y="254">43.0</text>
    <text x="52" y="209">44.0</text>
    <text x="52" y="164">45.0</text>
    <text x="52" y="119">46.0</text>
    <text x="52" y="74">47.0</text>
  </g>
  <line x1="60" y1="60" x2="60" y2="250" stroke="#CDD5E0" stroke-width="1"/>

  <!-- USL 46.5 -> y=92.5 ; LSL 43.5 -> y=227.5 ; center 45 -> 160 -->
  <line x1="60" y1="92.5" x2="700" y2="92.5" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="704" y="89" font-size="10" font-weight="600" fill="#DC2626">USL</text>
  <line x1="60" y1="227.5" x2="700" y2="227.5" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="704" y="231" font-size="10" font-weight="600" fill="#DC2626">LSL</text>
  <line x1="60" y1="160" x2="700" y2="160" stroke="#12945F" stroke-width="1.5"/>
  <text x="704" y="164" font-size="10" font-weight="600" fill="#12945F">CL</text>

  <!-- 16 points, last 8 above center (WE Rule 2) -->
  <polyline points="80,168 121,152 162,171 203,157 244,163 285,149 326,166 367,154 408,143 449,138 490,134 531,130 572,126 613,121 654,117 695,115"
            fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#FFFFFF" stroke="#2563EB" stroke-width="2">
    <circle cx="80" cy="168" r="3.5"/><circle cx="121" cy="152" r="3.5"/><circle cx="162" cy="171" r="3.5"/>
    <circle cx="203" cy="157" r="3.5"/><circle cx="244" cy="163" r="3.5"/><circle cx="285" cy="149" r="3.5"/>
    <circle cx="326" cy="166" r="3.5"/><circle cx="367" cy="154" r="3.5"/>
  </g>
  <g fill="#EA8A0B">
    <circle cx="408" cy="143" r="4"/><circle cx="449" cy="138" r="4"/><circle cx="490" cy="134" r="4"/>
    <circle cx="531" cy="130" r="4"/><circle cx="572" cy="126" r="4"/><circle cx="613" cy="121" r="4"/>
    <circle cx="654" cy="117" r="4"/><circle cx="695" cy="115" r="4.5"/>
  </g>
  <rect x="396" y="105" width="310" height="52" fill="#EA8A0B" opacity="0.07"/>
  <text x="551" y="176" font-size="10" font-weight="600" fill="#EA8A0B" text-anchor="middle">連續 8 點位於中心線同側 — WE Rule 2</text>
  <text x="695" y="105" font-size="11" font-weight="700" fill="#EA8A0B" text-anchor="middle">46.2</text>

  <g font-size="10" fill="#5A6B85" text-anchor="middle">
    <text x="80" y="270">#1</text><text x="285" y="270">#6</text><text x="490" y="270">#11</text><text x="695" y="270">#16</text>
  </g>
  <text x="380" y="290" font-size="10" fill="#8B99AE" text-anchor="middle">Sample Sequence</text>
</svg>
