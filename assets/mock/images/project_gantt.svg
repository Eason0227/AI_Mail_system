<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="740" height="300" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <rect width="740" height="300" fill="#FFFFFF"/>
  <text x="20" y="26" font-size="14" font-weight="600" fill="#1B2434">Titan 專案 — 時程與目前進度 (W32)</text>
  <text x="20" y="44" font-size="11" fill="#8B99AE">淺色為計畫時程，深色為實際進度　整體落後基準線 9%</text>

  <!-- timeline header -->
  <g stroke="#EDF0F4" stroke-width="1">
    <line x1="196" y1="62" x2="196" y2="262"/>
    <line x1="286" y1="62" x2="286" y2="262"/>
    <line x1="376" y1="62" x2="376" y2="262"/>
    <line x1="466" y1="62" x2="466" y2="262"/>
    <line x1="556" y1="62" x2="556" y2="262"/>
    <line x1="646" y1="62" x2="646" y2="262"/>
  </g>
  <g font-size="10" fill="#8B99AE" text-anchor="middle">
    <text x="196" y="76">07/15</text>
    <text x="286" y="76">07/29</text>
    <text x="376" y="76">08/12</text>
    <text x="466" y="76">08/26</text>
    <text x="556" y="76">09/09</text>
    <text x="646" y="76">09/23</text>
  </g>

  <!-- today line: 08/09 -> x = 376 - (3/14)*90 = 356.7 -->
  <line x1="357" y1="62" x2="357" y2="272" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="357" y="286" font-size="10" font-weight="600" fill="#DC2626" text-anchor="middle">今天 08/09</text>

  <g font-size="11" fill="#1B2434">
    <text x="20" y="102">設備安裝</text>
    <text x="20" y="136">設備驗收 (SAT)</text>
    <text x="20" y="170">製程參數調校</text>
    <text x="20" y="204">小批量試產</text>
    <text x="20" y="238">量產轉移</text>
  </g>

  <!-- rows: plan bar (light) + actual (solid) -->
  <!-- 設備安裝 06/24-07/20 -> x 60?  use 154..228 ; 100% -->
  <g>
    <rect x="150" y="90" width="82" height="16" rx="4" fill="#2563EB" opacity="0.15"/>
    <rect x="150" y="90" width="82" height="16" rx="4" fill="#12945F"/>
    <text x="240" y="103" font-size="10" font-weight="600" fill="#12945F">100% 已完成</text>
  </g>
  <!-- SAT 07/22-08/05 -> 305..395 plan ; actual 70% -->
  <g>
    <rect x="305" y="124" width="90" height="16" rx="4" fill="#2563EB" opacity="0.15"/>
    <rect x="305" y="124" width="63" height="16" rx="4" fill="#EA8A0B"/>
    <text x="403" y="137" font-size="10" font-weight="600" fill="#EA8A0B">70% 落後</text>
  </g>
  <!-- 製程參數調校 08/01-08/15 -> 331..421 ; 35% -->
  <g>
    <rect x="331" y="158" width="90" height="16" rx="4" fill="#2563EB" opacity="0.15"/>
    <rect x="331" y="158" width="31.5" height="16" rx="4" fill="#EA8A0B"/>
    <text x="429" y="171" font-size="10" font-weight="600" fill="#EA8A0B">35% 落後</text>
  </g>
  <!-- 小批量試產 08/16-08/28 -> 428..505 ; 0% -->
  <g>
    <rect x="428" y="192" width="77" height="16" rx="4" fill="#2563EB" opacity="0.15"/>
    <text x="513" y="205" font-size="10" fill="#8B99AE">0% 未開始</text>
  </g>
  <!-- 量產轉移 08/29-09/15 -> 512..621 ; 0% -->
  <g>
    <rect x="512" y="226" width="109" height="16" rx="4" fill="#2563EB" opacity="0.15"/>
    <text x="629" y="239" font-size="10" fill="#8B99AE">0% 未開始</text>
  </g>

  <!-- risk marker on SAT deadline 08/20 -->
  <line x1="415" y1="118" x2="415" y2="180" stroke="#DC2626" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="418" y="116" font-size="10" font-weight="600" fill="#DC2626">SAT 最遲 08/20</text>
</svg>
